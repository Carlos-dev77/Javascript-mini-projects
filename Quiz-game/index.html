<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

       <div class="screen active" id="start-screen">
          <h2>Quiz Time!</h2>
          <p>Test your knowledge with these fun questions</p>
          <button id="start-btn">Start Quiz</button>
       </div>

       <div class="screen" id="quiz-screen">
            <div class="quiz-header">
               <h2 id="question-text">Question will be posted here
                </h2>
                <div class="quiz-info">
                    <p>Question <span id="corect-question">1</span> of <span id="total-questions">5</span></p>
                    <p>Score: <span id="score"></span></p>
                </div>

             </div>

             
          <div class="answers-container" id="answers-container">
          <!--The choices will be shown here-->
          </div>
          
          <div class="progress-bar">

            <div class="progress" id="progress"></div>

           </div>


       </div>

       
       <div id="result-screen" class="screen">
            <h1>Quiz results</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">4</span>out of <span id="max-score">5</span></p>
                <p id="result-message">Good job!</p>
                <button id="result-btn">Restart quiz</button>

            </div>
       </div>

    </div>
   <script src="script.js"></script> 
</body>
</html>
